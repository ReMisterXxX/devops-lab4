name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: lab4-app:${{ github.sha }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Budowanie obrazu Docker
        run: docker build -t $IMAGE .
      - name: Zapis obrazu
        run: docker save $IMAGE -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  test:
    name: Test (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja zaleznosci
        run: pip install -r app/requirements.txt -r requirements-dev.txt
      - name: Testy jednostkowe
        run: pytest tests/unit -v

  integration-test:
    name: Test (integracyjne)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - run: docker load -i image.tar
      - name: Uruchomienie aplikacji z baza danych (docker compose)
        run: APP_IMAGE=$IMAGE docker compose up -d --no-build --wait
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Testy integracyjne
        run: BASE_URL=http://localhost:5000 pytest tests/integration -v
      - name: Logi aplikacji
        if: always()
        run: docker compose logs app
      - if: always()
        run: docker compose down -v

  deploy-test:
    name: Deploy (srodowisko testowe - Kubernetes)
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    if: github.event_name != 'pull_request'
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Utworzenie klastra Kubernetes (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: lab4
      - name: Zaladowanie obrazu do klastra
        run: |
          kind load image-archive image.tar --name lab4
          docker load -i image.tar
          docker tag $IMAGE lab4-app:rc-${{ github.run_number }}
          kind load docker-image lab4-app:rc-${{ github.run_number }} --name lab4
      - name: Wdrozenie manifestow
        run: |
          sed -i "s|image: lab4-app:latest|image: $IMAGE|" k8s/deployment.yaml
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/
          kubectl -n lab4-test rollout status deployment/postgres --timeout=180s
          kubectl -n lab4-test rollout status deployment/lab4-app --timeout=180s
      - name: Rolling update (nowa wersja obrazu)
        run: |
          kubectl -n lab4-test set image deployment/lab4-app lab4-app=lab4-app:rc-${{ github.run_number }}
          kubectl -n lab4-test rollout status deployment/lab4-app --timeout=180s
          kubectl -n lab4-test rollout history deployment/lab4-app
      - name: Weryfikacja dzialania (smoke test)
        run: |
          kubectl -n lab4-test port-forward service/lab4-app 8080:80 &
          sleep 5
          curl -sf http://localhost:8080/
          echo
          curl -sf http://localhost:8080/health
          echo
          curl -sf -X POST http://localhost:8080/tasks -H "Content-Type: application/json" -d '{"title":"Zadanie z Kubernetes"}'
          echo
      - name: Stan klastra
        if: always()
        run: kubectl -n lab4-test get all -o wide

  notify:
    name: Powiadomienie
    runs-on: ubuntu-latest
    needs: [build, test, integration-test, deploy-test]
    if: always()
    steps:
      - name: Podsumowanie wdrozenia
        run: |
          echo "## Status wdrozenia" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Test: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Testy integracyjne: ${{ needs.integration-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy: ${{ needs.deploy-test.result }}" >> $GITHUB_STEP_SUMMARY
      - name: Powiadomienie Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"Lab4 CI/CD: deploy ${{ needs.deploy-test.result }} (commit ${GITHUB_SHA::7})\"}" \
            "$SLACK_WEBHOOK_URL"
