services:
  app:
    image: ${APP_IMAGE:-lab4-app:latest}
    build: .
    container_name: lab4_app
    environment:
      APP_VERSION: ${APP_VERSION:-1.1.0}
      APP_ENV: ${APP_ENV:-docker}
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-lab4}
      POSTGRES_USER: ${POSTGRES_USER:-lab4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab4pass}
    ports:
      - "${APP_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    container_name: lab4_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab4}
      POSTGRES_USER: ${POSTGRES_USER:-lab4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab4pass}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
