apiVersion: v1
kind: Secret
metadata:
  name: lab4-db-secret
  namespace: lab4-test
type: Opaque
stringData:
  POSTGRES_USER: lab4
  POSTGRES_PASSWORD: lab4pass
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lab4-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: lab4-db-secret
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: lab4-config
                  key: POSTGRES_DB
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lab4"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lab4-test
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
